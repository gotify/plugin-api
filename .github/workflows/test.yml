name: Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.6
      - name: Install dependencies
        run: go mod download
      - name: Test
        run: cd v2 && go test -v ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24.6
      - name: Install dependencies
        run: go mod download
      - name: Test
        run: cd v2 && go test -v ./...