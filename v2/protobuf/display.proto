syntax = "proto3";
import "meta.proto";

option go_package = "./generated/protobuf";

message DisplayRequest {
    UserContext user = 1;
    string location = 2;
}

message DisplayResponse {
    string display = 1;
}

// A service that allows plugins to display content to the user.
service Displayer {
    rpc Display(DisplayRequest) returns (DisplayResponse);
}

