syntax = "proto3";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

option go_package = "./generated/protobuf";

message Error {
    google.protobuf.Any details = 1;
    string message = 2;
    string type = 3;
}

message UserContext {
    uint64 id = 1;
    string name = 2;
    bool admin = 3;
}

message Capabilities {
    optional uint32 Displayer = 1;
    optional uint32 Configurer = 2;
    optional uint32 Webhooker = 3;
}

message ServerVersionInfo {
    string version = 1;
    string commit = 2;
    string buildDate = 3;
}

message Info {
    string version = 1;
    string author = 2;
    string name = 3;
    string website = 4;
    string description = 5;
    string license = 6;
    string module_path = 7;
    Capabilities capabilities = 8;
}

message ExtrasValue {
    oneof value {
        string json = 1;
    }
}

message Message {
    string message = 1;
    string title = 2;
    int32 priority = 3;
    map<string, ExtrasValue> extras = 4;
}

message SetEnableRequest {
    UserContext user = 1;
    bool enable = 2;
}

message UserUpdate {
    oneof update {
        Message message = 1;
        string config = 2;
    }
}

message UserInstanceRequest {
    ServerVersionInfo serverVersion = 1;
    UserContext user = 2;
}

service Plugin {
    rpc GetPluginInfo(google.protobuf.Empty) returns (Info);
    rpc RunUserInstance(UserInstanceRequest) returns (stream UserUpdate);
}

