syntax = "proto3";
import "google/protobuf/empty.proto";
import "meta.proto";

option go_package = "./generated/protobuf";

message ServerEvent {
    oneof event {
        // A user has been created or updated.
        UserContext user = 1;
    }
}

// An optional RPC service that allows plugins to accept updates from the server.
service ServerEventReceiver {
    rpc ServerEvents(stream ServerEvent) returns (google.protobuf.Empty);
}
